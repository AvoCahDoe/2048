services:
  - type: web
    name: twenty48-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: pip install -r requirements-api.txt && pip install --no-deps -e .
    startCommand: uvicorn twenty48.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: CORS_ORIGINS
        value: "*"
