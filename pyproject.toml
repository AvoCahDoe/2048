[project]
name = "twenty48"
version = "0.1.0"
description = "2048 RL research lab: expectimax, Monte Carlo sims, and DQN with rich analytics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "matplotlib>=3.8.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
    "seaborn>=0.13.0",
    "tqdm>=4.66.0",
    "streamlit>=1.30.0",
    "pyyaml>=6.0",
    "pyarrow>=14.0.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "ipykernel>=6.29.0",
]

[project.scripts]
twenty48-sim = "twenty48.cli:sim_main"
twenty48-train = "twenty48.cli:train_main"
twenty48-eval = "twenty48.cli:eval_main"
twenty48-api = "twenty48.api:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twenty48"]

[tool.uv]
package = true
